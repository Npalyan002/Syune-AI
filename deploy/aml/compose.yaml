services:
  app:
    image: syune-aml-rc:local
    build:
      context: ../..
      dockerfile: deploy/aml/Dockerfile
    restart: unless-stopped
    environment:
      SYUNE_AML_STATE_ROOT: /var/lib/syune-aml
      SYUNE_AML_BEARER_TOKEN_FILE: /run/secrets/aml_bearer_token
      SYUNE_AML_MAX_BODY_BYTES: "1048576"
      SYUNE_AML_MAX_CONCURRENCY: "4"
      SYUNE_AML_QUEUE_WAIT_SECONDS: "1"
      SYUNE_AML_MIN_FREE_BYTES: "1073741824"
    secrets:
      - aml_bearer_token
    volumes:
      - aml_state:/var/lib/syune-aml
    expose:
      - "8080"
    read_only: true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 31m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

  proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SYUNE_AML_TLS_CERT_FILE:?set certificate path}:/run/tls/fullchain.pem:ro
      - ${SYUNE_AML_TLS_KEY_FILE:?set private-key path}:/run/tls/privkey.pem:ro
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  aml_state:

secrets:
  aml_bearer_token:
    file: ${SYUNE_AML_BEARER_TOKEN_FILE:?set bearer-token file path}
