worker_processes 1;
pid /var/run/nginx.pid;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format operations escape=json
      '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
      '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout operations;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=aml_per_ip:10m rate=8r/s;
    limit_conn_zone $binary_remote_addr zone=aml_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    map $status $retry_after {
        429 "1";
        503 "1";
        default "";
    }

    upstream syune_aml {
        server app:8080;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Retry-After $retry_after always;

        client_max_body_size 1m;
        client_body_timeout 30s;
        keepalive_timeout 10s;
        send_timeout 1800s;

        location = /health {
            proxy_pass http://syune_aml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location ~ ^/(add|search)$ {
            limit_req zone=aml_per_ip burst=16 nodelay;
            limit_conn aml_connections 8;
            proxy_pass http://syune_aml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_request_buffering on;
        }

        location / { return 404; }
    }
}
